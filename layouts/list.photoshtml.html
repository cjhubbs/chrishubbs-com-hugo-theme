{{ define "main" }}
<div class="page-wrap wide">
  <div class="section-head"><h1><i class="fa-solid fa-camera"></i>Photos</h1></div>
  <div class="photo-grid">
    {{- range where .Site.Pages ".Params.photos" "!=" nil }}
    <a href="{{ .Permalink }}">{{ range first 1 .Params.photos }}<img src="{{ . }}" width="300" height="300" loading="lazy" alt="">{{ end }}</a>
    {{- end }}
  </div>
</div>
{{ end }}
